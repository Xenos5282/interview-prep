<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="A 16-week interview prep tracker for DSA, system design, LLD and AI system design.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>16-Week Interview Prep</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: a training log app. Sticky app bar (brand, nav on desktop, streak, sync),
   one column of content, and a bottom tab bar on phones.
   Four places: This week (today's work), Tracks (the full syllabus), Leaderboard, You (sync, stats, settings). */
:root {
  --paper: #f4f5f8;
  --surface: #ffffff;
  --ink: #161a21;
  --muted: #5d6574;
  --faint: #8a92a0;
  --line: #e0e3ea;
  --chip: #eceef3;
  --accent: #2a4bd7;
  --accent-soft: #e8ecff;
  --on-accent: #ffffff;
  --dsa: #2a4bd7;
  --sd: #0f8a79;
  --lld: #a86f12;
  --ai: #c23f78;
  --side: #6f7786;
  --done: #1e9b57;
  --revisit: #d76f16;
  --easy: #1e8a52;
  --medium: #a8700f;
  --hard: #c43b3b;
  --gold: #c99412;
  --silver: #8e98a9;
  --bronze: #b0683a;
  --on-medal: #ffffff;
  --shadow: 0 1px 2px rgba(22, 26, 40, .05), 0 2px 10px rgba(22, 26, 40, .04);
  --display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f1217; --surface: #171b22; --ink: #e8ebf1; --muted: #a2aab8; --faint: #737c8b;
    --line: #2a2f39; --chip: #21262f; --accent: #8399ff; --accent-soft: #1d2442; --on-accent: #0f1217;
    --dsa: #8399ff; --sd: #3cc6b2; --lld: #e3ab4e; --ai: #f27baf; --side: #9aa2b0; --done: #4acb86; --revisit: #f2a055;
    --easy: #4fc98a; --medium: #e3ae4f; --hard: #f17b7b; --gold: #e6b84a; --silver: #b3bccb; --bronze: #d98e5d; --on-medal: #0f1217;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f1217; --surface: #171b22; --ink: #e8ebf1; --muted: #a2aab8; --faint: #737c8b;
  --line: #2a2f39; --chip: #21262f; --accent: #8399ff; --accent-soft: #1d2442; --on-accent: #0f1217;
  --dsa: #8399ff; --sd: #3cc6b2; --lld: #e3ab4e; --ai: #f27baf; --side: #9aa2b0; --done: #4acb86; --revisit: #f2a055;
  --easy: #4fc98a; --medium: #e3ae4f; --hard: #f17b7b; --gold: #e6b84a; --silver: #b3bccb; --bronze: #d98e5d; --on-medal: #0f1217;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4); color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 14.5px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--paper); }
a { color: inherit; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 980px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.ic { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; display: block; }
.eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.sw { width: 9px; height: 9px; border-radius: 2px; flex: none; display: inline-block; }
.sw.dsa { background: var(--dsa); } .sw.sd { background: var(--sd); } .sw.lld { background: var(--lld); } .sw.ai { background: var(--ai); } .sw.side { background: var(--side); }
[data-t="dsa"] { --tc: var(--dsa); } [data-t="sd"] { --tc: var(--sd); } [data-t="lld"] { --tc: var(--lld); } [data-t="ai"] { --tc: var(--ai); } [data-t="side"] { --tc: var(--side); }

/* app bar */
.appbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--paper); border-bottom: 1px solid var(--line); }
@supports (backdrop-filter: blur(1px)) and (color: color-mix(in srgb, red 50%, blue)) { .appbar { background: color-mix(in srgb, var(--paper) 88%, transparent); backdrop-filter: saturate(1.4) blur(12px); } }
.barrow { display: flex; align-items: center; gap: 10px; height: 58px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; min-width: 0; flex: none; }
.mark { width: 32px; height: 32px; border-radius: 8px; background: var(--ink); color: var(--paper); display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-stretch: 75%; font-size: 17px; letter-spacing: -.02em; flex: none; }
.bname { font-family: var(--display); font-weight: 800; font-stretch: 82%; font-size: 17px; line-height: 1.05; white-space: nowrap; }
.bname small { display: block; font-family: var(--mono); font-weight: 500; font-stretch: 100%; font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin-top: 2px; }
@media (max-width: 420px) { .bname { display: none; } }
.topnav { display: none; gap: 2px; margin-left: 12px; }
.nv { display: flex; align-items: center; gap: 7px; text-decoration: none; color: var(--muted); font-weight: 600; font-size: 13.5px; border-radius: 999px; padding: 7px 13px; white-space: nowrap; }
.nv:hover { color: var(--ink); }
.topnav .nv[aria-current="page"] { color: var(--ink); background: var(--chip); }
.topnav .nvi { display: none; }
.topnav .nv .ic { width: 17px; height: 17px; }
@media (min-width: 1000px) { .topnav .nvi { display: block; } }
.barend { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.streak { display: inline-flex; align-items: center; gap: 4px; height: 34px; padding: 0 11px 0 8px; border-radius: 999px; text-decoration: none; background: var(--chip); color: var(--faint); font-family: var(--mono); font-size: 13px; font-weight: 500; font-variant-numeric: tabular-nums; }
.streak .ic { width: 17px; height: 17px; fill: currentColor; stroke: none; }
.streak.hot { color: var(--revisit); background: color-mix(in srgb, var(--revisit) 13%, var(--surface)); }
.syncchip { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 13px; border-radius: 999px; text-decoration: none; font-size: 13px; font-weight: 600; white-space: nowrap; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.syncchip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
.syncchip[data-m="synced"] .dot { background: var(--done); }
.syncchip[data-m="saving"] .dot { background: var(--accent); }
.syncchip[data-m="error"] .dot, .syncchip[data-m="offline"] .dot { background: var(--revisit); }
.syncchip[data-m="cloudOff"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.syncchip .ic { width: 18px; height: 18px; }
@media (prefers-reduced-motion: no-preference) { .syncchip[data-m="saving"] .dot { animation: pulse 1s ease-in-out infinite; } }
@keyframes pulse { 50% { opacity: .3; } }

/* bottom tab bar (phones) */
.bottomnav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
.row4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); max-width: 560px; margin: 0 auto; }
.bottomnav .nv { flex-direction: column; justify-content: center; gap: 3px; padding: 7px 2px 8px; border-radius: 0; font-size: 11px; }
.bottomnav .nvi { display: grid; place-items: center; width: 54px; height: 28px; border-radius: 999px; }
.bottomnav .nv .ic { width: 21px; height: 21px; }
.bottomnav .nv[aria-current="page"] { color: var(--ink); }
.bottomnav .nv[aria-current="page"] .nvi { background: var(--accent-soft); color: var(--accent); }
main { padding-block: 18px calc(96px + env(safe-area-inset-bottom, 0px)); }
@media (min-width: 760px) {
  .topnav { display: flex; }
  .bottomnav { display: none; }
  main { padding-block: 26px 64px; }
}
.stack { display: grid; gap: 14px; min-width: 0; }

/* view headers */
.vhead { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 16px; }
.vhead .grow { flex: 1 1 260px; min-width: 0; }
.vhead h1 { margin: 0; font-family: var(--display); font-weight: 800; font-stretch: 76%; font-size: clamp(30px, 6.5vw, 40px); line-height: 1; letter-spacing: -.01em; text-wrap: balance; overflow-wrap: anywhere; }
.vhead p { margin: 6px 0 0; color: var(--muted); max-width: 62ch; text-wrap: pretty; }
.back { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); text-decoration: none; font-size: 13px; font-weight: 600; margin-bottom: 8px; }
.back:hover { color: var(--ink); }

/* buttons + fields */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 38px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 9px; padding: 8px 14px; cursor: pointer; font-weight: 600; font-size: 13.5px; text-decoration: none; white-space: nowrap; }
.btn:hover { border-color: var(--faint); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.big { min-height: 44px; padding: 10px 18px; font-size: 14.5px; }
.btn.quiet { background: none; border-color: transparent; color: var(--muted); }
.btn.quiet:hover { color: var(--ink); }
.btn.danger { color: var(--hard); border-color: color-mix(in srgb, var(--hard) 45%, var(--line)); }
.btn .ic { width: 17px; height: 17px; }
.iconbtn { width: 38px; height: 38px; display: grid; place-items: center; border: 1px solid var(--line); background: var(--surface); border-radius: 9px; cursor: pointer; color: var(--muted); }
.iconbtn:hover { color: var(--ink); }
.iconbtn .ic { width: 18px; height: 18px; }
.linkbtn { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
.more { color: var(--accent); font-weight: 600; text-decoration: none; font-size: 13px; white-space: nowrap; }
.more:hover { text-decoration: underline; text-underline-offset: 3px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row .sp { flex: 1; }
.field { color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 9px; padding: 8px 11px; min-height: 40px; min-width: 0; flex: 1 1 180px; }
.field.mono { font-family: var(--mono); text-transform: uppercase; letter-spacing: .05em; }
.field.date { flex: 0 1 auto; }
.lbl { font-weight: 600; font-size: 13.5px; }
.err { color: var(--hard); font-size: 13px; margin: 0; }
.okmsg { color: var(--done); font-size: 13px; margin: 0; font-weight: 500; }
.seg { display: inline-flex; background: var(--chip); border-radius: 10px; padding: 3px; gap: 2px; max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.seg::-webkit-scrollbar { display: none; }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 12.5px; font-weight: 600; cursor: pointer; color: var(--muted); white-space: nowrap; }
.chip:hover { color: var(--ink); }
.sel { position: relative; display: inline-flex; align-items: center; }
.sel select { appearance: none; -webkit-appearance: none; border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 7px 30px 7px 11px; font-size: 13px; font-weight: 600; color: var(--ink); cursor: pointer; min-height: 36px; }
.sel::after { content: ""; position: absolute; right: 12px; top: 50%; width: 6px; height: 6px; margin-top: -5px; border-right: 1.8px solid var(--muted); border-bottom: 1.8px solid var(--muted); transform: rotate(45deg); pointer-events: none; }

/* panels + cards */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.panel h2, .card h2, .synccard h2 { margin: 0; font-family: var(--display); font-stretch: 86%; font-weight: 700; font-size: 18px; line-height: 1.2; display: flex; align-items: center; gap: 8px; overflow-wrap: anywhere; }
.panel p { margin: 0; color: var(--muted); font-size: 13.5px; max-width: 64ch; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px 6px; box-shadow: var(--shadow); min-width: 0; }
.card.quiet { box-shadow: none; background: transparent; }
.chead { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.cad { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.count { margin-left: auto; font-family: var(--mono); font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.cbar { height: 3px; border-radius: 2px; background: var(--chip); margin: 10px 0 2px; overflow: hidden; display: flex; }
.cbar i { display: block; height: 100%; background: var(--tc, var(--done)); }
.tip { color: var(--muted); font-size: 13px; margin: 8px 0 2px; }
.sess { font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 12px 0 0; }
.empty { color: var(--faint); font-size: 13px; padding: 10px 0 12px; }
.empty.center { text-align: center; padding: 18px 0; }
.bar { height: 5px; border-radius: 3px; background: var(--chip); display: flex; overflow: hidden; }
.bar i { display: block; height: 100%; }
.bar .b-done { background: var(--done); }
.bar .b-rev { background: var(--revisit); }

/* week hero */
.hero { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; box-shadow: var(--shadow); display: grid; gap: 14px; min-width: 0; }
.htop { display: flex; align-items: center; gap: 14px; }
.hweek { flex: 1; min-width: 0; display: grid; gap: 3px; }
.hweek .eyebrow.now { color: var(--accent); }
.hwt { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.hwt b { font-family: var(--display); font-weight: 800; font-stretch: 70%; font-size: clamp(38px, 10vw, 50px); line-height: .92; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.arrows { display: inline-flex; gap: 6px; }
.navbtn { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); cursor: pointer; display: grid; place-items: center; color: var(--ink); padding: 0; }
.navbtn .ic { width: 17px; height: 17px; }
.navbtn:disabled { opacity: .3; cursor: default; }
.hweek small { color: var(--muted); font-size: 13px; }
.ring { position: relative; width: 76px; height: 76px; flex: none; }
.ring svg { width: 76px; height: 76px; transform: rotate(-90deg); display: block; }
.ring circle { fill: none; stroke-width: 7; }
.ring .bg { stroke: var(--chip); }
.ring .fg { stroke: var(--done); stroke-linecap: round; }
.ring span { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-stretch: 80%; font-size: 19px; font-variant-numeric: tabular-nums; }
.strip { display: grid; grid-template-columns: repeat(16, minmax(0, 1fr)); gap: 3px; }
.cell { position: relative; height: 32px; border: 0; padding: 0; border-radius: 5px; background: var(--chip); overflow: hidden; cursor: pointer; }
.cell::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: var(--p, 0%); background: var(--done); opacity: .85; }
.cell.now { box-shadow: inset 0 0 0 2px var(--ink); }
.cell[aria-current="true"] { outline: 2px solid var(--accent); outline-offset: 1px; }
.cell span { position: relative; z-index: 1; font-family: var(--mono); font-size: 10px; color: var(--muted); }
.cell.full span { color: var(--surface); }
.hfoot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; font-size: 13px; color: var(--muted); }
.hfoot b { color: var(--ink); font-weight: 600; }
.hfoot .sp { flex: 1; }

/* sync nudge + pace */
.nudge { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; align-items: start; border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--line)); background: var(--accent-soft); border-radius: 14px; padding: 14px 16px; }
.nudge > .ic { color: var(--accent); width: 24px; height: 24px; margin-top: 1px; }
.nudge b { font-size: 14.5px; }
.nudge p { margin: 2px 0 10px; color: var(--muted); font-size: 13.5px; }
.pace { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 14px; display: grid; gap: 8px; }
.pace .msg { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
.pace.ok .msg strong { color: var(--done); }
.pace.behind .msg strong { color: var(--revisit); }

/* items */
.list { list-style: none; margin: 0; padding: 0; }
.item { display: grid; grid-template-columns: 30px minmax(0, 1fr) 32px; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); align-items: start; }
.list > .item:first-child { border-top: 0; }
.st { width: 30px; height: 30px; border: 0; background: none; padding: 2px; cursor: pointer; color: var(--faint); border-radius: 50%; }
.st svg { width: 26px; height: 26px; display: block; }
.st:hover { color: var(--muted); }
.s-done .st { color: var(--done); }
.s-revisit .st { color: var(--revisit); }
.ck { stroke: var(--surface); }
.body { min-width: 0; display: grid; gap: 2px; padding-top: 3px; }
.t { font-weight: 500; text-decoration: none; overflow-wrap: anywhere; }
a.t { text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
a.t:hover { text-decoration-color: currentColor; }
.s-done .t { color: var(--muted); }
.meta { font-family: var(--mono); font-size: 11px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 8px; }
.d-E { color: var(--easy); } .d-M { color: var(--medium); } .d-H { color: var(--hard); }
.p-Must { color: var(--ink); font-weight: 500; }
.p-Optional { color: var(--faint); }
.tag-rev { color: var(--revisit); } .tag-done { color: var(--done); }
.vid { color: var(--ai); font-weight: 500; }
.vlink { color: var(--ai); text-decoration: none; font-weight: 500; }
.vlink:hover { text-decoration: underline; text-underline-offset: 2px; }
.hint { font-size: 12.5px; color: var(--muted); }
.mynote { font-size: 13px; padding: 4px 8px; margin-top: 4px; border-radius: 6px; background: var(--chip); white-space: pre-wrap; overflow-wrap: anywhere; }
.noteta { width: 100%; margin-top: 6px; font-size: 13.5px; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 8px; resize: vertical; min-height: 70px; }
.nb { width: 32px; height: 32px; border: 0; background: none; color: var(--faint); cursor: pointer; border-radius: 6px; position: relative; }
.nb svg { width: 18px; height: 18px; }
.nb:hover { color: var(--muted); }
.nb.has { color: var(--accent); }
.nb.has::after { content: ""; position: absolute; top: 5px; right: 5px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
details.queue { margin: 4px 0 8px; }
details.queue summary { cursor: pointer; font-size: 13px; color: var(--revisit); font-weight: 600; }

/* plan */
.plan { display: grid; gap: 12px; }
@media (min-width: 760px) { .plan { grid-template-columns: 1fr 1fr; } }
.pw { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 8px; min-width: 0; }
.pw.now { border-color: var(--ink); }
.pwh { display: flex; align-items: center; gap: 10px; }
.pwh b { font-family: var(--display); font-weight: 800; font-stretch: 70%; font-size: 26px; line-height: 1; }
.pwh small { color: var(--muted); font-size: 12px; display: block; }
.pwh .chip { margin-left: auto; }
.pline { display: grid; grid-template-columns: 9px minmax(0, 1fr); gap: 8px; font-size: 13px; align-items: baseline; }
.pline .sw { transform: translateY(1px); }
.pline span { overflow-wrap: anywhere; }
.pline em { font-style: normal; font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
.pline.side { color: var(--muted); }

/* tracks */

// item record: s = "d" done | "r" revisit, n = note, t = date done, w = points, u = last change (ms).
// A record with only "u" marks an item that was cleared, so the clear syncs too.
function normalize(d) {
  const out = { start: DEFAULT_START, su: 0, items: {} };
  if (d && typeof d === "object") {
    if (typeof d.start === "string" && DATE_RE.test(d.start)) out.start = d.start;
    if (typeof d.su === "number" && isFinite(d.su)) out.su = d.su;
    const it = d.items && typeof d.items === "object" ? d.items : {};
    for (const k of Object.keys(it)) {
      const v = it[k];
      if (!BYID.has(k) || !v || typeof v !== "object") continue;
      const rec = {};
      if (v.s === "d" || v.s === "r") rec.s = v.s;
      if (typeof v.n === "string" && v.n) rec.n = v.n.slice(0, 4000);
      if (typeof v.t === "string" && DATE_RE.test(v.t)) rec.t = v.t;
      if (typeof v.w === "number" && isFinite(v.w)) rec.w = v.w;
      if (typeof v.u === "number" && isFinite(v.u)) rec.u = v.u;
      if (rec.s || rec.n || rec.u) out.items[k] = rec;
    }
  }
  return out;
}
// Per-item merge: the newer change wins. Ties keep a.
function mergeDocs(a, b) {
  const out = { start: a.start, su: a.su || 0, items: {} };
  if (b.start && (b.su || 0) > (a.su || 0)) { out.start = b.start; out.su = b.su; }
  const keys = new Set(Object.keys(a.items || {}).concat(Object.keys(b.items || {})));
  for (const k of keys) {
    const x = a.items[k], y = b.items[k];
    out.items[k] = !y ? x : !x ? y : (y.u || 0) > (x.u || 0) ? y : x;
  }
  return out;
}

async function startSync() {
  try {
    if (!window.claude || typeof window.claude.use !== "function") return;
    const [user, db] = await Promise.all([window.claude.use("user"), window.claude.use("db")]);
    if (!user || !db) return;
    const uid = await user.id();
    if (!uid) return;
    sync.ref = db.doc("data/users/" + uid + "/prep");
    sync.ref.onSnapshot(snap => {
      if (snap.metadata && snap.metadata.hasPendingWrites) return;
      if (sync.dirty || sync.saving) return;
      if (snap.exists) {
        state = normalize(snap.data());
        saveLocal();
        if (!sync.denied) setSync("synced");
        render();

  } catch (e) { /* stay local */ }
}
async function flush() {
  if (!sync.ref || sync.denied) { sync.dirty = false; return; }
  if (sync.saving) { sync.again = true; return; }
  sync.saving = true; setSync("saving");
  const body = JSON.parse(JSON.stringify({ v: 1, start: state.start, su: state.su, items: state.items, updatedAt: new Date().toISOString() }));
  try {
    await sync.ref.set(body);
    sync.dirty = false; sync.retried = false; setSync("synced");
  } catch (e) {
    const c = e && e.code;
    if (c === "unavailable" && !sync.retried) {
      sync.retried = true; sync.saving = false;
      setTimeout(flush, 1200 + Math.random() * 1200);
      return;
    }
    sync.retried = false; sync.dirty = false;
    if (["invalid_argument", "not_granted", "capability_disabled", "capability_removed", "revoked", "transform_error"].includes(c)) { sync.denied = true; setSync("local"); }
    else setSync("error");
  }
  sync.saving = false;
  if (sync.again) { sync.again = false; sync.dirty = true; flush(); }
}
function commit() {
  saveLocal();
  if (sync.ref && !sync.denied) {
    sync.dirty = true;
    clearTimeout(sync.timer);
    sync.timer = setTimeout(flush, 700);
  }
  if (cloud.code && cloudAvailable()) {
    clearTimeout(cloud.timer);
    cloud.timer = setTimeout(cloudSave, 1200);
  }
}

const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function parseD(s) { const p = s.split("-").map(Number); return new Date(p[0], p[1] - 1, p[2]); }
function addDays(d, n) { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() + n); return x; }
function fmt(d) { return d.getDate() + " " + MON[d.getMonth()]; }
function iso(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function weekStart(w) { return addDays(parseD(state.start), (w - 1) * 7); }

function curWeek() { return Math.floor(daysIn() / 7) + 1; }
const clampW = w => Math.max(1, Math.min(16, w));
function status(id) { const r = state.items[id]; return r && r.s === "d" ? "done" : r && r.s === "r" ? "revisit" : "todo"; }
const domId = id => "n-" + id.replace(/[^a-z0-9]/gi, "-");

};
const NAV = [["week", "This week"], ["tracks", "Tracks"], ["board", "Leaderboard"], ["you", "You"]];

/* ---------- item row ---------- */
function metaHTML(x, withWeek) {
  const parts = [];
  if (x.video) parts.push('<span class="vid">▶ Video' + (x.len ? " · " + esc(x.len) : "") + "</span>");
  else if (x.pageVid) parts.push('<span class="vid">▶ Video on the page</span>');
  if (x.track === "dsa") {
    parts.push('<span class="d-' + x.diff + '">' + DIFF[x.diff] + "</span>", esc(x.cat));
  } else if (x.track === "side") {
    parts.push(esc(x.source), "after " + esc(x.after));
  } else {
    parts.push(esc(x.type));
    if (x.by) parts.push(esc(x.by));
  }
  if (x.prio) parts.push('<span class="p-' + x.prio + '">' + x.prio + "</span>");
  if (withWeek) parts.push(x.week ? "W" + x.week : "extra");
  const st = status(x.id), rec = state.items[x.id];
  if (st === "done" && rec && rec.t) parts.push('<span class="tag-done">done ' + esc(fmt(parseD(rec.t))) + "</span>");
  if (st === "revisit") parts.push('<span class="tag-rev">revisit</span>');
  if (x.track === "dsa") parts.push('<a class="vlink" href="' + esc(ytSearch(x.title)) + '" target="_blank" rel="noopener" title="Opens a YouTube search for NeetCode\'s walkthrough">▶ NeetCode video</a>');
  return parts.map(p => "<span>" + p + "</span>").join("");
}
function itemHTML(x, withWeek) {
  const st = status(x.id);
  const rec = state.items[x.id];
  const note = rec && rec.n ? rec.n : "";
  const open = openNotes.has(x.id);
  const title = x.url
    ? '<a class="t" href="' + esc(x.url) + '" target="_blank" rel="noopener">' + esc(x.title) + "</a>"
    : '<span class="t">' + esc(x.title) + "</span>";
  return '<li class="item s-' + st + '" data-id="' + esc(x.id) + '">' +
    '<button class="st" type="button" data-act="cycle" aria-label="' + esc(x.title) + ": " + ST_LABEL[st] + '" title="' + ST_LABEL[st] + '">' + ICON[st] + "</button>" +
    '<div class="body">' + title +
      '<div class="meta">' + metaHTML(x, withWeek) + "</div>" +
      (x.hint ? '<div class="hint">' + esc(x.hint) + "</div>" : "") +
      (note && !open ? '<div class="mynote">' + esc(note) + "</div>" : "") +
      (open ? '<textarea class="noteta" id="' + domId(x.id) + '" data-note="' + esc(x.id) + '" rows="3" placeholder="Pattern, key trick, gaps to fix…" aria-label="Note for ' + esc(x.title) + '">' + esc(note) + "</textarea>" : "") +
    "</div>" +
    '<button class="nb' + (note ? " has" : "") + '" type="button" data-act="note" aria-expanded="' + open + '" aria-label="' + (open ? "Close note" : note ? "Edit note" : "Add a note") + '">' + ICON.note + "</button>" +
  "</li>";
}
const listHTML = (xs, withWeek) => '<ul class="list">' + xs.map(x => itemHTML(x, withWeek)).join("") + "</ul>";

/* ---------- counts + stats ---------- */
function counts(xs) {
  let d = 0, r = 0;
  for (const x of xs) { const s = status(x.id); if (s === "done") d++; else if (s === "revisit") r++; }
  return { done: d, rev: r, total: xs.length };
}
function weekFill(w) {
  const xs = ITEMS.filter(x => x.week === w && x.track !== "side");
  const c = counts(xs);
  return c.total ? c.done / c.total : 0;
}
// Same rules as the leaderboard: done and revisit both count, streak = consecutive days with a tick ending today or yesterday.
function myStats() {
  let pts = 0, wk = 0, n = 0;
  const days = new Set();
  const now = new Date(), weekAgo = iso(addDays(now, -6));
  for (const k of Object.keys(state.items)) {
    const r = state.items[k];
    if (r.s !== "d" && r.s !== "r") continue;
    const w = r.w != null ? r.w : weightOf(BYID.get(k));
    pts += w; n++;
    if (r.t) { days.add(r.t); if (r.t >= weekAgo) wk += w; }
  }
  let d = new Date(now.getFullYear(), now.getMonth(), now.getDate()), streak = 0;
  if (!days.has(iso(d))) d = addDays(d, -1);
  while (days.has(iso(d))) { streak++; d = addDays(d, -1); }
  return { pts, wk, n, streak };
}
function weekline() {
  const d = daysIn(), cw = curWeek(), end = fmt(addDays(parseD(state.start), 111));
  return d < 0 ? "Starts in " + -d + (d === -1 ? " day" : " days") + ", ends " + end
    : cw > 16 ? "Finished on " + end
    : "Week " + cw + " of 16, ends " + end;
}
const AVA = ["--dsa", "--sd", "--ai", "--lld", "--revisit", "--done"];
function avaHTML(name) {
  const s = String(name || "");
  let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  const p = s.trim().split(/[\s_.\-]+/).filter(Boolean);
  const ini = p.length ? (p[0][0] + (p[1] ? p[1][0] : (p[0][1] || ""))).toUpperCase() : "?";
  return '<span class="ava" aria-hidden="true" style="--ac:var(' + AVA[h % AVA.length] + ')">' + esc(ini) + "</span>";
}

/* ---------- chrome: nav, streak, sync ---------- */
function navHTML() {
  return NAV.map(n => '<a class="nv" href="#' + n[0] + '" data-nav="' + n[0] + '"><span class="nvi">' + NI[n[0]] + "</span><span>" + n[1] + "</span></a>").join("");
}
document.getElementById("topnav").innerHTML = navHTML();
document.getElementById("bottomnav").innerHTML = '<div class="row4">' + navHTML() + "</div>";
function renderChrome() {
  const active = view === "plan" ? "week" : view;
  document.querySelectorAll("[data-nav]").forEach(a => {
    if (a.dataset.nav === active) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
  const st = myStats(), sc = document.getElementById("streakchip");
  sc.className = "streak" + (st.streak ? " hot" : "");
  sc.innerHTML = NI.flame + "<b>" + st.streak + "</b>";
  const lab = st.streak + "-day streak. Open the leaderboard";
  sc.title = lab; sc.setAttribute("aria-label", lab);
  paintSync();
}

/* ---------- this week ---------- */
function stripHTML() {
  const cw = curWeek();
  let s = "";
  for (let w = 1; w <= 16; w++) {
    const p = Math.round(weekFill(w) * 100);
    const cls = "cell" + (w === cw ? " now" : "") + (p >= 60 ? " full" : "");
    s += '<button type="button" class="' + cls + '" data-week="' + w + '" style="--p:' + p + '%" aria-label="Week ' + w + ", " + p + '% done"' + (w === selWeek ? ' aria-current="true"' : "") + "><span>" + w + "</span></button>";
  }
  return s;
}
function showNudge() {
  return cloudAvailable() && !cloud.code && !nudgeOff && Object.values(state.items).some(r => r.s);
}
function weekView() {
  const w = selWeek, cw = curWeek(), d = daysIn();
  const c = counts(ITEMS.filter(x => x.week === w && x.track !== "side"));
  const pct = c.total ? Math.round((c.done / c.total) * 100) : 0;
  const label = d < 0 ? "Starts in " + -d + (d === -1 ? " day" : " days") : cw > 16 ? "Plan finished" : w === cw ? "This week" : w < cw ? "Earlier week" : "Coming up";
  const R = 30, C = 2 * Math.PI * R;
  let h = '<section class="hero" aria-label="Week ' + w + '">' +
    '<div class="htop"><div class="hweek">' +
      '<span class="eyebrow' + (w === cw ? " now" : "") + '">' + esc(label) + "</span>" +
      '<div class="hwt"><b>Week ' + String(w).padStart(2, "0") + "</b>" +
        '<span class="arrows"><button type="button" class="navbtn" data-step="-1" aria-label="Previous week"' + (w <= 1 ? " disabled" : "") + ">" + NI.left + "</button>" +
        '<button type="button" class="navbtn" data-step="1" aria-label="Next week"' + (w >= 16 ? " disabled" : "") + ">" + NI.right + "</button></span></div>" +
      "<small>" + weekRange(w) + "</small></div>" +
      '<div class="ring" role="img" aria-label="' + pct + "% of week " + w + ' done"><svg viewBox="0 0 76 76"><circle class="bg" cx="38" cy="38" r="' + R + '"/>' +
        (pct ? '<circle class="fg" cx="38" cy="38" r="' + R + '" stroke-dasharray="' + C.toFixed(2) + '" stroke-dashoffset="' + (C * (1 - pct / 100)).toFixed(2) + '"/>' : "") +
        "</svg><span>" + pct + "%</span></div>" +
    "</div>" +
    '<div class="strip" role="group" aria-label="Jump to a week. Each week fills as you finish it">' + stripHTML() + "</div>" +
    '<div class="hfoot"><span><b>' + c.done + " of " + c.total + "</b> done" + (c.rev ? " · " + c.rev + " to revisit" : "") + "</span>" +
      '<span class="sp"></span>' +
      (w !== clampW(cw) && cw >= 1 && cw <= 16 ? '<button type="button" class="chip" data-week="' + cw + '">Back to this week</button>' : "") +
      '<a class="more" href="#plan">All 16 weeks →</a></div>' +
  "</section>";

  if (showNudge()) {
    h += '<section class="nudge" aria-label="Turn on sync">' + NI.cloud + "<div><b>Your progress is only saved in this browser.</b>" +
      "<p>Turn on sync to back it up and pick it up on your phone or laptop. No sign-up, just a code.</p>" +
      '<div class="row"><a class="btn primary" href="#you">Turn on sync</a><button type="button" class="btn quiet" data-act="nudge-off">Not now</button></div></div></section>';
  }

  if (w === cw && cw > 1) {
    const carry = ITEMS.filter(x => x.track !== "side" && x.week >= 1 && x.week < cw && status(x.id) === "todo").sort((a, b) => a.week - b.week || byOrder(a, b));
    if (!carry.length) h += '<div class="pace ok"><div class="msg"><strong>On pace.</strong><span>Everything scheduled before this week is done.</span></div></div>';
    else {
      h += '<div class="pace behind"><div class="msg"><strong>' + carry.length + (carry.length === 1 ? " item" : " items") + " from earlier weeks still open.</strong>" +
        '<button type="button" class="linkbtn" data-act="carry">' + (showCarry ? "Hide" : "Show them") + "</button></div>" +
        (showCarry ? listHTML(carry, true) : "") + "</div>";
    }
  }

  for (const t of TRACKS) {
    const xs = ITEMS.filter(x => x.track === t.key && x.week === w).sort(byOrder);
    const k = counts(xs);
    h += '<section class="card' + (t.key === "side" ? " quiet" : "") + '" data-t="' + t.key + '" aria-label="' + esc(t.long) + '">' +
      '<div class="chead"><h2><i class="sw ' + t.key + '"></i>' + esc(t.long) + '</h2><span class="cad">' + esc(t.cadence) + '</span><span class="count">' + k.done + "/" + k.total + "</span></div>" +
      (t.key !== "side" && k.total ? '<div class="cbar"><i style="width:' + (k.done / k.total) * 100 + '%"></i></div>' : "");
    if (t.key === "dsa") {
      h += '<p class="tip">Mon–Sat: one a day (two if both are Easy). Sunday: redo one from your Revisit queue. Watch the ▶ NeetCode video only after your own attempt.</p>';
      const rq = ITEMS.filter(x => x.track === "dsa" && status(x.id) === "revisit").sort((a, b) => a.week - b.week || byOrder(a, b));
      if (rq.length) h += '<details class="queue"><summary>Revisit queue (' + rq.length + ")</summary>" + listHTML(rq, true) + "</details>";
    }
    if (t.key === "side") h += '<p class="tip">Only if you\'re on schedule. Read after the item it pairs with.</p>';
    if (!xs.length) h += '<div class="empty">Nothing scheduled this week.</div>';
    else if (t.key === "sd" || t.key === "ai") {
      for (const s of [1, 2]) {
        const ss = xs.filter(x => x.s === s);
        if (!ss.length) continue;
        h += '<div class="sess">Session ' + s + "</div>" + listHTML(ss, false);
      }
    } else h += listHTML(xs, false);
    h += "</section>";
  }
  return '<div class="stack">' + h + "</div>";
}

/* ---------- all 16 weeks ---------- */
function planView() {
  const cw = curWeek();
  let h = '<div class="vhead"><div class="grow"><a class="back" href="#week">← This week</a><h1>All 16 weeks</h1>' +
    "<p>" + esc(weekline()) + '. Change the start date on the <a href="#you">You</a> page and every week moves with it.</p></div></div><div class="plan">';
  for (let w = 1; w <= 16; w++) {
    const pct = Math.round(weekFill(w) * 100);
    h += '<article class="pw' + (w === cw ? " now" : "") + '"><div class="pwh"><b>W' + String(w).padStart(2, "0") + "</b><div><small>" + weekRange(w) + (w === cw ? " · this week" : "") + "</small><small>" + pct + "% done</small></div>" +
      '<button type="button" class="chip" data-week="' + w + '">Open week</button></div>';
    for (const t of TRACKS) {
      const xs = ITEMS.filter(x => x.track === t.key && x.week === w).sort(byOrder);
      if (!xs.length) continue;
      let txt;
      if (t.key === "dsa") {
        const cats = [...new Set(xs.map(x => x.cat))];
        txt = "<em>" + xs.length + " problems</em> " + esc(cats.join(", "));
      } else if (t.key === "sd" || t.key === "ai") {
        txt = [1, 2].map(s => { const ss = xs.filter(x => x.s === s); return ss.length ? "<em>S" + s + "</em> " + esc(ss.map(x => x.title).join(", ")) : ""; }).filter(Boolean).join(" · ");
      } else txt = esc(xs.map(x => x.title).join(", "));
      h += '<div class="pline' + (t.key === "side" ? " side" : "") + '"><i class="sw ' + t.key + '"></i><span>' + txt + "</span></div>";
    }
    h += "</article>";
  }
  return '<div class="stack">' + h + "</div></div>";
}

/* ---------- tracks ---------- */
function trackView(key) {
  const t = TRACK[key], f = F[key];
  const labels = ["Main source", "How to work it", "Rhythm", "Done means", "Videos"];
  let h = '<div class="vhead"><div class="grow"><h1>Tracks</h1><p>The whole syllabus, track by track. Search, filter and tick things off here or in This week.</p></div></div>';
  h += '<nav class="tiles" aria-label="Pick a track">' + TRACKS.map(tr => {
    const c = counts(ITEMS.filter(x => x.track === tr.key));
    const pd = c.total ? (c.done / c.total) * 100 : 0, pr = c.total ? (c.rev / c.total) * 100 : 0;
    return '<a class="tile" data-t="' + tr.key + '" href="#' + tr.key + '"' + (tr.key === key ? ' aria-current="page"' : "") + ">" +
      '<span class="tn"><i class="sw ' + tr.key + '"></i>' + esc(tr.name) + "</span>" +
      '<span class="tc">' + c.done + " / " + c.total + " " + tr.noun + "</span>" +
      '<span class="bar"><i class="b-done" style="width:' + pd + '%"></i><i class="b-rev" style="width:' + pr + '%"></i></span></a>';
  }).join("") + "</nav>";
  h += '<div class="thead" data-t="' + key + '"><h2><i class="sw ' + key + '"></i>' + esc(t.long) + '</h2><span class="cad">' + esc(t.cadence) + "</span></div>";
  h += '<details class="how"' + (howOpen ? " open" : "") + "><summary>How to work this track</summary><dl>" +
    METHOD[key].map((v, i) => "<div><dt>" + labels[i] + "</dt><dd>" + esc(v) + "</dd></div>").join("") + "</dl></details>";
  const sOpts = [["all", "All"], ["todo", "Open"], ["done", "Done"], ["revisit", "Revisit"]];
  h += '<div class="toolbar">' +
    '<input type="search" class="search" id="q-' + key + '" data-q="' + key + '" placeholder="Search ' + esc(t.long) + '" value="' + esc(f.q) + '" aria-label="Search ' + esc(t.long) + '">' +
    '<div class="row"><div class="seg" role="group" aria-label="Status">' +
      sOpts.map(s => '<button type="button" id="fs-' + key + "-" + s[0] + '" data-fs="' + s[0] + '" aria-pressed="' + (f.s === s[0]) + '">' + s[1] + "</button>").join("") + "</div>";
  if (key !== "side") h += '<label class="sel"><select id="fp-' + key + '" data-fsel="p" aria-label="Priority">' +
    [["all", "Any priority"], ["Must", "Must"], ["Good", "Good"], ["Optional", "Optional"]].map(o => '<option value="' + o[0] + '"' + (f.p === o[0] ? " selected" : "") + ">" + o[1] + "</option>").join("") + "</select></label>";
  if (key !== "dsa") h += '<label class="sel"><select id="fv-' + key + '" data-fsel="v" aria-label="Format">' +
    [["all", "Any format"], ["video", "▶ Videos"], ["other", "Reading & practice"]].map(o => '<option value="' + o[0] + '"' + (f.v === o[0] ? " selected" : "") + ">" + o[1] + "</option>").join("") + "</select></label>";
  h += "</div></div>";
  h += '<div id="tlist">' + trackList(key) + "</div>";
  return '<div class="stack">' + h + "</div>";
}
function trackList(key) {
  const f = F[key], q = f.q.trim().toLowerCase();
  const all = ITEMS.filter(x => x.track === key);
  const xs = all
    .filter(x => f.p === "all" || x.prio === f.p)
    .filter(x => f.s === "all" || status(x.id) === f.s)
    .filter(x => key === "dsa" || f.v === "all" || (f.v === "video") === isVideo(x))
    .filter(x => !q || (x.title + " " + (x.cat || "") + " " + (x.type || "") + " " + (x.by || "") + " " + (x.source || "") + " " + (x.after || "")).toLowerCase().includes(q));
  const found = '<p class="found">' + (xs.length === all.length ? "All " + all.length + " " + TRACK[key].noun : xs.length + " of " + all.length + " " + TRACK[key].noun) + "</p>";
  if (!xs.length) return '<div class="stack">' + found + '<div class="empty">Nothing matches these filters.</div></div>';
  const weeks = [...new Set(xs.map(x => x.week))].sort((a, b) => (a || 99) - (b || 99));
  let h = found;
  for (const w of weeks) {
    const g = xs.filter(x => x.week === w).sort(byOrder);
    const c = counts(all.filter(x => x.week === w));
    h += '<section class="card"><div class="ghead"><h3>' + (w ? "Week " + w : "Extras") + "</h3><small>" + (w ? weekRange(w) : "No week; do these if you're ahead") + '</small><span class="count">' + c.done + "/" + c.total + "</span></div>" + listHTML(g, false) + "</section>";
  }
  return '<div class="stack">' + h + "</div>";
}

/* ---------- leaderboard ---------- */
const POINTS_HOW = [
  ["DSA", "Easy 1 point, Medium 2, Hard 3."],
  ["Design work", "Design problems, mocks, practice designs, hands-on builds and reviews: 3 points each."],
  ["Reading and videos", "1 point each, side quests included."],
  ["Revisit", "Marking something Revisit keeps its points."],
  ["Last 7 days", "Points from things you ticked in the last 7 days. All time counts everything."],
  ["Streak", "Consecutive days with at least one tick, ending today or yesterday."]
];
function boardView() {
  const web = cloudAvailable();
  const per = lb.sort === "week" ? "week_points" : "points";
  const period = lb.sort === "week" ? "in the last 7 days" : "all time";
  let h = '<div class="vhead"><div class="grow"><h1>Leaderboard</h1><p>' + (lb.sort === "week" ? "Ranked by points in the last 7 days." : "Ranked by all-time points.") + " It runs on trust, so tick honestly.</p></div>";
  if (web) h += '<div class="row"><div class="seg" role="group" aria-label="Period">' +
    [["week", "Last 7 days"], ["all", "All time"]].map(o => '<button type="button" id="bs-' + o[0] + '" data-bsort="' + o[0] + '" aria-pressed="' + (lb.sort === o[0]) + '">' + o[1] + "</button>").join("") +
    '</div><button type="button" class="iconbtn" data-cloud="refresh" aria-label="Refresh the leaderboard" title="Refresh">' + NI.refresh + "</button></div>";
  h += "</div>";
  if (!web) {
    h += '<section class="panel"><h2>' + NI.board + "The leaderboard is on the website</h2><p>Inside Claude your progress is private to your account. On the website you can sync with a code and join the leaderboard with a nickname.</p>" +
      '<div class="row"><a class="btn primary" href="' + SITE + '" target="_blank" rel="noopener">Open the website</a></div></section>';
    return '<div class="stack">' + h + "</div>";
  }
  const rows = lb.rows || [];
  const meI = rows.findIndex(r => r.is_you), me = rows[meI];
  if (lb.profile && lb.profile.on_board && !lb.renaming) {
    h += '<section class="mecard" aria-label="Your place"><div class="merank">' + (me ? "#" + (meI + 1) : lb.rows ? "–" : "…") + "</div>" +
      '<div class="mename">' + esc(lb.profile.nickname) + '<span class="youtag">you</span></div>' +
      '<div class="mesub">' + (me ? me[per] + " points " + period + " · " + me.streak + "-day streak · " + me.solved + " done" : lb.rows ? "Outside the top 100 for now." : "Loading your place…") + "</div>" +
      '<div class="row"><button type="button" class="btn" data-cloud="rename">Change name</button><button type="button" class="btn quiet" data-cloud="leave">Leave the leaderboard</button></div></section>';
  } else {
    h += '<section class="joincard"><h2>' + (lb.renaming ? "Change your name" : "Join the leaderboard") + "</h2>" +
      (lb.renaming ? "" : "<p>Pick a nickname. Others see your nickname, points, streak and how many items you've done. Your notes stay private.</p>") +
      '<div class="row"><input id="nickin" class="field" maxlength="24" placeholder="Nickname" autocomplete="nickname" value="' + esc(lb.nameDraft) + '" aria-label="Nickname on the leaderboard">' +
      '<button type="button" class="btn primary" data-cloud="join">' + (lb.renaming ? "Save name" : "Join") + "</button>" +
      (lb.renaming ? '<button type="button" class="btn quiet" data-cloud="rename-cancel">Cancel</button>' : "") + "</div>" +
      (!cloud.code && !lb.renaming ? '<p>Joining also turns on sync, so your progress is backed up. You\'ll find your code on the <a href="#you">You</a> page.</p>' : "") + "</section>";
  }
  if (lb.err2) h += '<p class="err">' + esc(lb.err2) + "</p>";
  if (lb.err) h += '<section class="panel"><p class="err">' + esc(lb.err) + '</p><div class="row"><button type="button" class="btn" data-cloud="refresh">Try again</button></div></section>';
  else if (!lb.rows) h += '<section class="card lbcard" aria-busy="true"><div class="stack" style="padding:6px 0 10px"><div class="skel"></div><div class="skel" style="width:80%"></div><div class="skel" style="width:60%"></div></div></section>';
  else {
    h += '<ol class="podium" aria-label="Top three">' + [0, 1, 2].map(i => {
      const r = rows[i];
      if (!r) return '<li class="pod empty r' + (i + 1) + '"><span class="ava" aria-hidden="true">?</span><span class="pname">Open spot</span><span class="ppts">&nbsp;</span><span class="pstreak">&nbsp;</span><span class="step">' + (i + 1) + "</span></li>";
      return '<li class="pod r' + (i + 1) + (r.is_you ? " you" : "") + '">' + avaHTML(r.nickname) +
        '<span class="pname">' + esc(r.nickname) + (r.is_you ? " (you)" : "") + "</span>" +
        '<span class="ppts"><b>' + r[per] + "</b> pts</span>" +
        '<span class="pstreak">' + r.streak + "-day streak</span>" +
        '<span class="step" aria-hidden="true">' + (i + 1) + "</span></li>";
    }).join("") + "</ol>";
    if (!rows.length) h += '<p class="empty center">No one is on the board yet. Join and take first place.</p>';
    if (rows.length > 3) {
      h += '<section class="card lbcard" aria-label="Everyone else"><ol class="lb" start="4">' + rows.slice(3).map((r, j) =>
        '<li class="lbrow' + (r.is_you ? " you" : "") + '"><span class="lbrank">' + (j + 4) + "</span>" + avaHTML(r.nickname) +
        '<div><div class="lbname">' + esc(r.nickname) + (r.is_you ? '<span class="youtag">you</span>' : "") + "</div>" +
        '<div class="lbsub">' + r.streak + "-day streak · " + r.solved + " done" + (lb.sort === "week" ? " · " + r.points + " total" : "") + "</div></div>" +
        '<div class="lbpts">' + r[per] + "<small>" + (lb.sort === "week" ? "7-day pts" : "points") + "</small></div></li>").join("") + "</ol></section>";
    }
  }
  h += '<details class="how"><summary>How points work</summary><dl>' + POINTS_HOW.map(p => "<div><dt>" + p[0] + "</dt><dd>" + p[1] + "</dd></div>").join("") + "</dl></details>";
  return '<div class="stack">' + h + "</div>";
}

/* ---------- you ---------- */
function syncCardHTML() {
  const msg = (cloud.msg ? '<p class="okmsg" role="status">' + esc(cloud.msg) + "</p>" : "") + (cloud.err ? '<p class="err" role="alert">' + esc(cloud.err) + "</p>" : "");
  if (!cloudAvailable()) {
    const on = syncMode === "synced";
    return '<section class="synccard' + (on ? " on" : "") + '"><h2>' + NI.cloud + (on ? "Synced to your Claude account" : "Saved in this browser") + "</h2>" +
      "<p>" + (on ? "Your ticks and notes follow you to any device where you open this artifact. They're private to you."
        : "Your ticks and notes stay in this browser. Sign in to Claude to keep them on your account across devices.") + "</p>" +
      '<p>Sync codes and the leaderboard live on the website version. <a href="' + SITE + '" target="_blank" rel="noopener">Open the website</a></p></section>';
  }
  if (cloud.code) {
    return '<section class="synccard on" aria-label="Sync"><h2>' + NI.cloud + "Sync is on</h2>" +
      "<p>Open the link on your other devices, or enter the code there. Anyone with it can see and edit your progress, so keep it to yourself.</p>" +
      '<div class="codebox" id="mycode">' + esc(cloud.code) + "</div>" +
      '<div class="row"><button type="button" class="btn primary" data-cloud="copylink">' + NI.link + "Copy link</button>" +
      '<button type="button" class="btn" data-cloud="copy">' + NI.copy + "Copy code</button>" +
      '<span class="sp"></span><button type="button" class="btn quiet" data-cloud="stop">Stop syncing here</button></div>' + msg + "</section>";
  }
  return '<section class="synccard off" aria-label="Sync"><h2>' + NI.cloud + "Sync across devices</h2>" +
    "<p>Right now your progress is only in this browser. Get a code to back it up and carry it to your phone or laptop. No sign-up, no email.</p>" +
    '<div class="row"><button type="button" class="btn primary big" data-cloud="new">Get my sync code</button></div>' +
    '<div class="or">or</div>' +
    '<label class="lbl" for="codein">Have a code from another device?</label>' +
    '<div class="row"><input id="codein" class="field mono" placeholder="XXXX-XXXX-XXXX" autocomplete="off" spellcheck="false" maxlength="16" value="' + esc(cloud.codeDraft) + '">' +
    '<button type="button" class="btn" data-cloud="use">Use code</button></div>' + msg + "</section>";
}
function youView() {
  const st = myStats(), all = counts(ITEMS);
  const onBoard = !!(lb.profile && lb.profile.on_board);
  const web = cloudAvailable();
  let h = '<div class="vhead"><div class="grow"><h1>' + (onBoard ? esc(lb.profile.nickname) : "You") + "</h1><p>Your stats, sync and settings.</p></div></div>";
  const stat = (v, l, cls) => '<div class="stat' + (cls ? " " + cls : "") + '"><b>' + v + "</b><span>" + l + "</span></div>";
  h += '<div class="stats">' + stat(st.pts, "Total points") + stat(st.wk, "Points, last 7 days") +
    stat(st.streak, "Day streak", st.streak ? "hot" : "") + stat((all.done + all.rev) + "<small> / " + all.total + "</small>", "Items done") + "</div>";
  h += syncCardHTML();
  if (web) {
    const rows = lb.rows || [], meI = rows.findIndex(r => r.is_you);
    h += '<a class="linkcard" href="#board">' + NI.board + "<div><b>" + (onBoard ? "On the leaderboard as " + esc(lb.profile.nickname) : "Join the leaderboard") + "</b><span>" +
      (onBoard ? (meI >= 0 ? "#" + (meI + 1) + (lb.sort === "week" ? " in the last 7 days" : " all time") : "See where you stand") : "Pick a nickname and see how your week stacks up.") +
      '</span></div><span class="chev">' + NI.chev + "</span></a>";
  }
  h += '<section class="panel"><h2>Progress by track</h2><div class="meters">' + TRACKS.map(t => {
    const c = counts(ITEMS.filter(x => x.track === t.key));
    const pd = c.total ? (c.done / c.total) * 100 : 0, pr = c.total ? (c.rev / c.total) * 100 : 0;
    return '<button type="button" class="meter" data-go="' + t.key + '"><span class="mrow"><span class="name"><i class="sw ' + t.key + '"></i>' + esc(t.long) + '</span><span class="num">' + c.done + " / " + c.total + "</span></span>" +
      '<span class="bar"><i class="b-done" style="width:' + pd + '%"></i><i class="b-rev" style="width:' + pr + '%"></i></span></button>';
  }).join("") + "</div></section>";
  h += '<section class="panel"><h2>Plan</h2><div class="setrow"><label class="lbl" for="start">Start date</label><input type="date" id="start" class="field date" value="' + esc(state.start) + '"></div>' +
    "<p>" + esc(weekline()) + '. Every week moves with the start date. <a href="#plan">See all 16 weeks</a></p></section>';
  const where = !web
    ? "Ticks and notes are private to you. If you're signed in and allowed to save here, they sync to your Claude account. Otherwise they stay in this browser."
    : cloud.code ? "Saved in this browser and synced to your code. Notes never appear on the leaderboard."
    : "Saved only in this browser. Clearing site data or switching browsers loses it unless sync is on.";
  h += '<section class="panel"><h2>Your data</h2><p>' + where + "</p>" +
    (confirmReset
      ? '<div class="row"><span>Clear every tick and note' + (cloud.code ? ", here and on your synced devices" : "") + '?</span><button type="button" class="btn danger" data-act="reset-yes">Clear everything</button><button type="button" class="btn quiet" data-act="reset-no">Cancel</button></div>'
      : '<div class="row"><button type="button" class="btn danger" data-act="reset">Reset my progress</button></div>') +
    '</section><p class="foot">Problem links go to LeetCode, Hello Interview, Anthropic, Hamel Husain, Chip Huyen and the other original sources.</p>';
  return '<div class="stack">' + h + "</div>";
}

/* ---------- render ---------- */
function render() {
  renderChrome();
  const m = document.getElementById("main");
  const ae = document.activeElement;
  const focusId = ae && ae !== document.body && m.contains(ae) ? ae.id : "";
  let caret = null;
  if (focusId) { try { caret = ae.selectionStart; } catch (e) {} }
  m.innerHTML = view === "week" ? weekView() : view === "plan" ? planView() : view === "board" ? boardView() : view === "you" ? youView() : trackView(trackSel);
  if (focusId) {
    const el = document.getElementById(focusId);
    if (el) { el.focus({ preventScroll: true }); if (caret != null && el.setSelectionRange) { try { el.setSelectionRange(caret, caret); } catch (e) {} } }
  }
}

/* ---------- events ---------- */
function cycle(id) {
  const st = status(id);
  const rec = Object.assign({}, state.items[id] || {});
  if (st === "todo") { rec.s = "d"; rec.t = iso(new Date()); rec.w = weightOf(BYID.get(id)); }
  else if (st === "done") { rec.s = "r"; }
  else { delete rec.s; delete rec.t; delete rec.w; }
  rec.u = Date.now();
  state.items[id] = rec;
  commit();
  render();
}
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act],[data-week],[data-go],[data-step],[data-fs],[data-nav],[data-home]");
  if (!el) return;
  if (el.dataset.nav === "week" || el.dataset.home) { selWeek = clampW(curWeek()); showCarry = false; if (view === "week") { render(); window.scrollTo({ top: 0 }); } return; }
  if (el.dataset.nav) return;
  if (el.dataset.week) { selWeek = clampW(+el.dataset.week); showCarry = false; if (view !== "week") location.hash = "week"; else render(); window.scrollTo({ top: 0 }); return; }
  if (el.dataset.go) { location.hash = el.dataset.go; return; }
  if (el.dataset.step) { selWeek = clampW(selWeek + +el.dataset.step); render(); return; }
  if (el.dataset.fs) { F[trackSel].s = el.dataset.fs; render(); return; }
  const act = el.dataset.act, li = el.closest(".item"), id = li && li.dataset.id;
  if (act === "cycle" && id) cycle(id);
  else if (act === "note" && id) {
    if (openNotes.has(id)) openNotes.delete(id); else openNotes.add(id);
    render();
    if (openNotes.has(id)) { const ta = document.getElementById(domId(id)); if (ta) ta.focus(); }
  }
  else if (act === "carry") { showCarry = !showCarry; render(); }
  else if (act === "nudge-off") { nudgeOff = true; try { localStorage.setItem(NUDGE_KEY, "1"); } catch (e) {} render(); }
  else if (act === "reset") { confirmReset = true; render(); }
  else if (act === "reset-no") { confirmReset = false; render(); }
  else if (act === "reset-yes") {
    confirmReset = false;
    const now = Date.now();
    for (const k of Object.keys(state.items)) state.items[k] = { u: now };
    openNotes.clear(); commit(); render();
  }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset && t.dataset.note) {
    const id = t.dataset.note;
    const rec = Object.assign({}, state.items[id] || {});
    const v = t.value.slice(0, 4000);
    if (v) rec.n = v; else delete rec.n;
    rec.u = Date.now();
    state.items[id] = rec;
    commit();
  } else if (t.id === "nickin") {
    lb.nameDraft = t.value;
  } else if (t.id === "codein") {
    cloud.codeDraft = t.value;
  } else if (t.dataset && t.dataset.q) {
    F[t.dataset.q].q = t.value;
    const box = document.getElementById("tlist");
    if (box) box.innerHTML = trackList(t.dataset.q);
  }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "start") {
    const v = t.value;
    if (!DATE_RE.test(v)) return;
    state.start = v; state.su = Date.now(); selWeek = clampW(curWeek()); commit(); render();
  } else if (t.dataset && t.dataset.fsel) {
    F[trackSel][t.dataset.fsel] = t.value;
    const box = document.getElementById("tlist");
    if (box) box.innerHTML = trackList(trackSel);
  }
});
document.addEventListener("toggle", e => {
  if (e.target.matches && e.target.matches("details.how") && view === "tracks") howOpen = e.target.open;
}, true);
document.addEventListener("focusout", e => {
  const t = e.target;
  if (t.dataset && t.dataset.note) {
    const id = t.dataset.note;
    setTimeout(() => {
      const a = document.activeElement;
      if (a && a.closest && a.closest('.item[data-id="' + CSS.escape(id) + '"]')) return;
      openNotes.delete(id); render();
    }, 120);
  }
});
function route() {
  const h = location.hash.slice(1);
  if (Object.prototype.hasOwnProperty.call(TRACK, h)) { view = "tracks"; trackSel = h; }
  else if (h === "method") { view = "tracks"; howOpen = true; }
  else view = VIEW_SET.has(h) ? h : "week";
  confirmReset = false;
  cloud.msg = ""; cloud.err = ""; lb.err2 = "";
  render();
  if (cloudView()) { loadBoard(); loadProfile(); }
}
window.addEventListener("hashchange", () => { route(); window.scrollTo({ top: 0 }); });

route();
startSync();
startCloud();
})();
</script>

</body>
